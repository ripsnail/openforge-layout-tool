services:
  dev:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src:ro
      - ./index.html:/app/index.html:ro
      - ./downloaded:/app/downloaded
    environment:
      - NODE_ENV=development
      - OPENFORGE_CATALOG_API_URL=${OPENFORGE_CATALOG_API_URL:-https://staging.openforge.tools}
      - OPENFORGE_CATALOG_OBJECTS_URL=${OPENFORGE_CATALOG_OBJECTS_URL:-https://objects.openforge.tools}
