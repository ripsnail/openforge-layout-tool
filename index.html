<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Defense-in-depth CSP: the app renders catalog names/tags/file names into
    the DOM (see src/catalogPalette.js, which escapes everything routed
    through innerHTML), so this restricts script/style/connect sources as a
    backstop in case an escaping bug is ever missed. `img-src` allows the
    CDN the model catalog serves thumbnails/objects from
    (OPENFORGE_CATALOG_OBJECTS_URL default in vite.config.js) — update this
    if that env var is overridden to point at a different host.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://objects.openforge.tools; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <title>OpenForge Layout Tool</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="app">
    <div id="notifications"></div>
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>OpenForge</h1>
        <p class="subtitle">Layout Tool</p>
      </div>
      <div id="search-box">
        <input type="text" id="search-input" placeholder="Filter models..." />
      </div>
      <div id="model-palette">
        <div class="loading">Loading models...</div>
      </div>
      <div id="bom-resize"></div>
      <div id="bom-section">
        <div class="bom-header">
          <span>Materials</span>
          <button id="bom-download-all" class="bom-download-btn" title="Download all placed STL files">Download All</button>
        </div>
        <div id="bom-list"></div>
      </div>
      <div id="override-panel"></div>
    </aside>
    <div id="sidebar-resize"></div>
    <main id="viewport-area">
      <div id="tab-bar">
        <div id="tab-list"></div>
        <div class="toolbar-dropdown" id="new-file-wrapper">
          <button id="tab-new" title="New file" aria-haspopup="menu" aria-expanded="false">+</button>
          <div id="new-file-menu" class="dropdown-menu" role="menu">
            <button role="menuitem" data-action="new-blank">New Blank</button>
            <button role="menuitem" data-action="new-duplicate">Duplicate Current</button>
          </div>
        </div>
      </div>
      <div id="viewport">
      <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading models...</div>
      </div>
      <div id="toolbar">
        <div class="toolbar-dropdown">
          <button class="tool-btn toolbar-menu-btn" id="file-btn" aria-haspopup="menu" aria-expanded="false">File</button>
          <div class="dropdown-menu" id="file-menu" role="menu">
            <button role="menuitem" data-action="save">Save Layout...</button>
            <button role="menuitem" data-action="load">Load Layout...</button>
          </div>
        </div>
        <div class="toolbar-dropdown">
          <button class="tool-btn toolbar-menu-btn" id="templates-btn" aria-haspopup="menu" aria-expanded="false">Templates</button>
          <div class="dropdown-menu" id="templates-menu" role="menu"></div>
        </div>
        <div class="toolbar-separator"></div>
        <button class="tool-btn active" data-tool="select" title="Select (Q)">Select</button>
        <button class="tool-btn" data-tool="place" title="Place (W)">Place</button>
        <button class="tool-btn" data-tool="delete" title="Delete (D)">Delete</button>
        <div class="toolbar-separator"></div>
        <div class="toolbar-dropdown">
          <button class="tool-btn toolbar-menu-btn" id="settings-btn" aria-haspopup="menu" aria-expanded="false">Settings</button>
          <div class="dropdown-menu settings-menu" id="settings-menu" role="menu"></div>
        </div>
      </div>
      <div id="info-bar">
        <span id="model-count">Models: 0</span>
        <span id="tool-info">Click a model in the palette to start</span>
      </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
